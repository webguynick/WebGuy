name: Daily SEO + Lighthouse Audit

on:
  schedule:
    # 09:00 UTC = 02:00 PT (adjust as you like)
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Lighthouse against production
        id: lh
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://webguynick.com/
            https://webguynick.com/services
            https://webguynick.com/hosting
            https://webguynick.com/resources
            https://webguynick.com/articles
          budgetPath: ./.github/lighthouse-budget.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Open issue with Lighthouse results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Daily audit — ${today}`,
              body: [
                `Automated Lighthouse + SEO audit for ${today}.`,
                ``,
                `- Lighthouse CI artifact: see workflow run`,
                `- Pages tested: /, /services, /hosting, /resources, /articles`,
                ``,
                `If any page dropped below the performance budget, address it and the next run will confirm.`,
              ].join('\n'),
              labels: ['audit', 'automated'],
            });
